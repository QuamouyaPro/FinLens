<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/>
    </marker>
    <marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#FFFFFF"/>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Pipeline d'analyse : aujourd'hui et après optimisation</text>
  <text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Même qualité de sortie, deux passages coûteux supprimés et six appels parallélisés</text><rect x="40" y="100" width="440" height="430" rx="10" fill="#F8E9E6" stroke="#A63A2E" stroke-width="2"/><text x="62" y="130" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#A63A2E" text-anchor="start" letter-spacing="1.5">AUJOURD'HUI</text><text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">une seule requête HTTP synchrone</text><rect x="62" y="168" width="396" height="36" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#0F130E" text-anchor="start">Extraction Fable 5 — corpus complet</text><rect x="62" y="212" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 1 — Sonnet 5 (séquentiel)</text><rect x="62" y="240" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="257" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 2 — Sonnet 5 (séquentiel)</text><rect x="62" y="268" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="285" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 3 — Sonnet 5 (séquentiel)</text><rect x="62" y="296" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="313" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 4 — Sonnet 5 (séquentiel)</text><rect x="62" y="324" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="341" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 5 — Sonnet 5 (séquentiel)</text><rect x="62" y="352" width="396" height="24" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="74" y="369" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 6 — Sonnet 5 (séquentiel)</text><rect x="62" y="380" width="396" height="36" rx="5" fill="#F3D9D4" stroke="#A63A2E" stroke-width="1.5"/><text x="74" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#0F130E" text-anchor="start">Contradictions Fable 5 — corpus complet (2e fois)</text><text x="62" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#A63A2E" text-anchor="start">≈ 10 à 20 min sur un dossier de 300 pages</text><text x="62" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">→ dépasse le plafond d'une fonction Vercel : l'analyse échoue.</text><text x="62" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">→ aucune reprise : tout est à relancer, et à repayer.</text><rect x="520" y="100" width="440" height="430" rx="10" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="542" y="130" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#146B45" text-anchor="start" letter-spacing="1.5">APRÈS</text><text x="542" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">job asynchrone sur le worker</text><rect x="542" y="168" width="396" height="36" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="554" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#0F130E" text-anchor="start">Extraction Fable 5 — corpus complet (une fois)</text><rect x="542" y="212" width="396" height="28" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="554" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="start">Profil 1 — Sonnet 5, amorce le cache</text><rect x="542" y="248" width="396" height="74" rx="5" fill="#FFFFFF" stroke="#146B45" stroke-width="1.5"/><text x="554" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="start">Profils 2 à 6 — en parallèle, lecture du cache</text><rect x="554" y="280" width="68" height="28" rx="4" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="588" y="299" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">P2</text><rect x="630" y="280" width="68" height="28" rx="4" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="664" y="299" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">P3</text><rect x="706" y="280" width="68" height="28" rx="4" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="740" y="299" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">P4</text><rect x="782" y="280" width="68" height="28" rx="4" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="816" y="299" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">P5</text><rect x="858" y="280" width="68" height="28" rx="4" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="892" y="299" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">P6</text><rect x="542" y="332" width="396" height="36" rx="5" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="554" y="355" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#0F130E" text-anchor="start">Contradictions — lues sur l'extraction structurée</text><text x="542" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#146B45" text-anchor="start">≈ 3 à 5 min, sans plafond de durée</text><text x="542" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">→ coût d'analyse réduit de l'ordre de moitié (un seul</text><text x="542" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">    passage plein tarif sur le corpus au lieu de deux).</text><text x="542" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">→ reprise à l'étape, progression visible.</text><text x="40" y="570" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#8A928A" text-anchor="start">Les durées sont des ordres de grandeur, à confirmer par mesure sur des dossiers réels une fois le worker en place.</text></svg>