  <text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Ce qui garantit que la citation pointe la bonne page — le cœur de la promesse produit</text><rect x="30" y="190" width="140" height="66" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="100" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">Question</text><text x="100" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">de l'analyste</text><rect x="215" y="120" width="195" height="66" rx="8" fill="#FFFFFF" stroke="#2E6B99" stroke-width="2"/><text x="312" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F130E" text-anchor="middle">Recherche vectorielle</text><text x="312" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">pgvector — sens général</text><rect x="215" y="262" width="195" height="66" rx="8" fill="#FFFFFF" stroke="#2E6B99" stroke-width="2"/><text x="312" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F130E" text-anchor="middle">Recherche plein texte</text><text x="312" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">Postgres FR — chiffres exacts</text><rect x="455" y="190" width="130" height="66" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="520" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F130E" text-anchor="middle">Fusion RRF</text><text x="520" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">≈ 30 passages</text><rect x="630" y="190" width="150" height="66" rx="8" fill="#E8F3ED" strok