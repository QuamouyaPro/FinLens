<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/>
    </marker>
    <marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/>
    </marker>
  </defs>
  <rect width="1000" height="900" fill="#FFFFFF"/>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Parcours d'un dossier, de l'upload à la note</text>
  <text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Chaque étape indique où elle s'exécute réellement</text><circle cx="70" cy="133" r="19" fill="#146B45"/><text x="70" y="139" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><rect x="110" y="105" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Dépôt du document</text><text x="130" y="149" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">PDF, Word ou Excel déposé par l'analyste dans un dossier</text><rect x="762" y="120" width="198" height="28" rx="14" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="861" y="139" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#146B45" text-anchor="middle">VERCEL</text><line x1="70" y1="153" x2="70" y2="192" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="217" r="19" fill="#146B45"/><text x="70" y="223" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><rect x="110" y="189" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Stockage et mise en file</text><text x="130" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Fichier en Storage, puis une ligne jobs(type=ingestion)</text><rect x="762" y="204" width="198" height="28" rx="14" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="861" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2E6B99" text-anchor="middle">SUPABASE</text><line x1="70" y1="237" x2="70" y2="276" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="301" r="19" fill="#146B45"/><text x="70" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><rect x="110" y="273" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Préparation du fichier</text><text x="130" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">OCR si aucune couche texte ; Word/Excel via LibreOffice headless</text><rect x="762" y="288" width="198" height="28" rx="14" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="861" y="307" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-ingest</text><line x1="70" y1="321" x2="70" y2="360" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="385" r="19" fill="#146B45"/><text x="70" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><rect x="110" y="357" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Découpage et vectorisation</text><text x="130" y="401" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Chunking par page, embeddings Voyage envoyés par lots</text><rect x="762" y="372" width="198" height="28" rx="14" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="861" y="391" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-worker</text><line x1="70" y1="405" x2="70" y2="444" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="469" r="19" fill="#146B45"/><text x="70" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><rect x="110" y="441" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="465" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Mémoire du dossier</text><text x="130" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">document_chunks : texte + vecteur + organization_id / dossier_id</text><rect x="762" y="456" width="198" height="28" rx="14" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="861" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2E6B99" text-anchor="middle">SUPABASE</text><line x1="70" y1="489" x2="70" y2="528" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="553" r="19" fill="#146B45"/><text x="70" y="559" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><rect x="110" y="525" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="549" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Extraction exhaustive</text><text x="130" y="569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Fable 5, un seul passage sur le corpus, six catégories sourcées</text><rect x="762" y="540" width="198" height="28" rx="14" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="861" y="559" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-worker</text><line x1="70" y1="573" x2="70" y2="612" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="637" r="19" fill="#146B45"/><text x="70" y="643" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><rect x="110" y="609" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="633" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Six reformulations par profil</text><text x="130" y="653" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Sonnet 5 : la première amorce le cache, les cinq autres en parallèle</text><rect x="762" y="624" width="198" height="28" rx="14" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="861" y="643" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-worker</text><line x1="70" y1="657" x2="70" y2="696" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="721" r="19" fill="#146B45"/><text x="70" y="727" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text><rect x="110" y="693" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="717" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Contradictions et checklist</text><text x="130" y="737" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Détectées sur l'extraction structurée, pas sur le corpus brut</text><rect x="762" y="708" width="198" height="28" rx="14" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="861" y="727" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-worker</text><line x1="70" y1="741" x2="70" y2="780" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><circle cx="70" cy="805" r="19" fill="#146B45"/><text x="70" y="811" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">9</text><rect x="110" y="777" width="630" height="56" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="130" y="801" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#0F130E" text-anchor="start">Restitution</text><text x="130" y="821" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">Progression en direct, puis note par profil et citations cliquables</text><rect x="762" y="792" width="198" height="28" rx="14" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="861" y="811" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#146B45" text-anchor="middle">VERCEL</text><text x="40" y="870" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#8A928A" text-anchor="start">Les étapes 3 à 8 sont hors de toute contrainte de durée : c'est précisément ce que l'architecture actuelle ne permet pas.</text></svg>