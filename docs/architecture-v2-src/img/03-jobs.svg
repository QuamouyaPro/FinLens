<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/>
    </marker>
    <marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Cycle de vie d'un job</text>
  <text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Reprise, idempotence et alerte en cas d'échec définitif</text><rect x="50" y="150" width="190" height="66" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="2"/><text x="145" y="180" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">en_attente</text><text x="145" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">dans la file</text><rect x="340" y="150" width="190" height="66" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="435" y="180" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">en_cours</text><text x="435" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">verrouillé par un worker</text><rect x="660" y="150" width="190" height="66" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="755" y="180" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">termine</text><text x="755" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">résultats écrits</text><rect x="340" y="310" width="190" height="66" rx="8" fill="#F8E9E6" stroke="#A63A2E" stroke-width="2"/><text x="435" y="340" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">echec</text><text x="435" y="360" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">erreur capturée</text><rect x="660" y="310" width="190" height="66" rx="8" fill="#FBF3E4" stroke="#A9741A" stroke-width="2"/><text x="755" y="340" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="middle">abandonne</text><text x="755" y="360" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">alerte n8n</text><line x1="240" y1="183" x2="336" y2="183" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><text x="244" y="174" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">FOR UPDATE SKIP LOCKED</text><line x1="530" y1="183" x2="656" y2="183" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><text x="552" y="174" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">toutes les étapes OK</text><line x1="435" y1="216" x2="435" y2="306" stroke="#A63A2E" stroke-width="2" marker-end="url(#a)"/><text x="445" y="265" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">erreur API, crash, redémarrage</text><path d="M 340 343 L 145 343 L 145 220" fill="none" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><text x="150" y="366" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">nouvelle tentative — reprise à la dernière étape validée, backoff</text><line x1="530" y1="343" x2="656" y2="343" stroke="#A9741A" stroke-width="2" marker-end="url(#a)"/><text x="548" y="334" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">après 3 tentatives</text><text x="50" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Idempotence : un job porte une clé unique (dossier_id + type). Deux clics ne déclenchent qu'une seule analyse — et donc une seule facturation.</text><text x="50" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">La progression étape par étape est lue directement depuis cette table : l'interface affiche « Profil 5 sur 8 » au lieu d'un sablier.</text></svg>