<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/>
    </marker>
    <marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/>
    </marker>
  </defs>
  <rect width="1000" height="800" fill="#FFFFFF"/>
  <text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Architecture cible FinLens</text>
  <text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Vercel = synchrone court · VPS = long et lourd · Supabase = source de vérité unique</text><rect x="200" y="95" width="300" height="46" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="350" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F130E" text-anchor="middle">Navigateur — l'analyste</text><line x1="350" y1="141" x2="350" y2="171" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="40" y="175" width="620" height="150" rx="10" fill="#FFFFFF" stroke="#146B45" stroke-width="2"/><text x="58" y="201" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#146B45" text-anchor="start" letter-spacing="1.5">VERCEL</text><text x="140" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#8A928A" text-anchor="start">toute réponse en moins de 30 secondes</text><rect x="58" y="212" width="180" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="148" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Interface Next.js</text><rect x="250" y="212" width="180" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="340" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">API CRUD + quotas</text><rect x="442" y="212" width="160" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="522" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Copilote (SSE)</text><rect x="58" y="262" width="180" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="148" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Exports PDF / Word</text><rect x="250" y="262" width="180" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="340" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Stripe checkout</text><rect x="442" y="262" width="160" height="40" rx="6" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.5"/><text x="522" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Crons légers</text><line x1="350" y1="325" x2="350" y2="359" stroke="#59615A" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="365" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">lecture / écriture — isolation RLS</text><rect x="40" y="363" width="620" height="150" rx="10" fill="#FFFFFF" stroke="#2E6B99" stroke-width="2"/><text x="58" y="389" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#2E6B99" text-anchor="start" letter-spacing="1.5">SUPABASE</text><text x="158" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#8A928A" text-anchor="start">source de vérité unique — données ET vecteurs</text><rect x="58" y="400" width="180" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="148" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Postgres + RLS</text><rect x="250" y="400" width="180" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="340" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">pgvector (chunks)</text><rect x="442" y="400" width="160" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="522" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Storage (fichiers)</text><rect x="58" y="450" width="180" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="148" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Auth</text><rect x="250" y="450" width="180" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="340" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">Table jobs</text><rect x="442" y="450" width="160" height="40" rx="6" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.5"/><text x="522" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="middle">usage_logs</text><line x1="350" y1="513" x2="350" y2="547" stroke="#59615A" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="365" y="536" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#59615A" text-anchor="start">file de jobs tirée par le worker (SKIP LOCKED)</text><rect x="40" y="551" width="620" height="185" rx="10" fill="#0E1211" stroke="#0E1211" stroke-width="1.5"/><text x="58" y="579" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#F3F5F3" text-anchor="start" letter-spacing="1.5">VPS HOSTINGER KVM 2 + COOLIFY</text><text x="58" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#97A19A" text-anchor="start">aucun plafond de durée — c'est là que vit tout le traitement lourd</text><rect x="58" y="614" width="182" height="76" rx="6" fill="#08090A" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.09"/><text x="149" y="637" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-worker</text><text x="149" y="656" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">extraction, profils,</text><text x="149" y="672" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">contradictions</text><rect x="258" y="614" width="182" height="76" rx="6" fill="#08090A" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.09"/><text x="349" y="637" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#F3F5F3" text-anchor="middle">finlens-ingest</text><text x="349" y="656" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">OCR, Word / Excel,</text><text x="349" y="672" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">découpage</text><rect x="458" y="614" width="182" height="76" rx="6" fill="#08090A" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.09"/><text x="549" y="637" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#F3F5F3" text-anchor="middle">n8n</text><text x="549" y="656" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">supervision, alertes,</text><text x="549" y="672" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="middle">purge RGPD</text><text x="58" y="714" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#97A19A" text-anchor="start">Déployés et supervisés via Coolify — aucune ligne de commande au quotidien.</text><rect x="700" y="175" width="260" height="561" rx="10" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="718" y="201" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#59615A" text-anchor="start" letter-spacing="1.5">SERVICES EXTERNES</text><rect x="718" y="225" width="224" height="90" rx="6" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="730" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="start">API Anthropic</text><text x="730" y="272" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">Fable 5 — extraction, comparateur</text><text x="730" y="289" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">Sonnet 5 — profils, chat</text><text x="730" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">Haiku 4.5 — classification</text><rect x="718" y="335" width="224" height="72" rx="6" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="730" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="start">Voyage AI</text><text x="730" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">embeddings (voyage-3-large)</text><text x="730" y="399" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">rerank des passages</text><rect x="718" y="427" width="224" height="56" rx="6" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="730" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="start">Stripe</text><text x="730" y="472" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">abonnements Essentiel / Analyste / Fonds</text><rect x="718" y="503" width="224" height="56" rx="6" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="730" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F130E" text-anchor="start">GitHub</text><text x="730" y="548" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">source de vérité du code, CI vers Vercel</text><line x1="660" y1="250" x2="714" y2="250" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="664" y="240" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#8A928A" text-anchor="start">chat</text><path d="M 660 640 L 680 640 L 680 380 L 714 380" fill="none" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="40" y="768" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#8A928A" text-anchor="start">Le worker tire ses tâches de la file — aucun webhook à perdre. Les flèches doubles sont des échanges bidirectionnels.</text><text x="40" y="788" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#8A928A" text-anchor="start">Le worker appelle Anthropic et Voyage AI pour l'analyse ; Vercel n'appelle Anthropic que pour le chat.</text></svg>