<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/></marker><marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/></marker><marker id="aDan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A2E"/></marker><marker id="aSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9741A"/></marker><marker id="aInf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B99"/></marker></defs><rect width="1000" height="600" fill="#FFFFFF"/><text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Cycles de vie d'un dossier et d'un document</text><text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Ce qui est conservé, ce qui est libéré, ce qui est réellement supprimé</text><text x="40" y="100" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#59615A" text-anchor="start" letter-spacing="1.5">DOSSIER</text><rect x="40" y="118" width="170" height="112" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="125" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#146B45" text-anchor="middle">Actif</text><text x="125" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">compte dans le plafond</text><text x="125" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">(4 Essentiel · 15 Pro)</text><rect x="290" y="118" width="170" height="112" rx="8" fill="#E7F0F7" stroke="#2E6B99" stroke-width="2"/><text x="375" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2E6B99" text-anchor="middle">Archivé</text><text x="375" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">libère un emplacement,</text><text x="375" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">rien n'est supprimé</text><rect x="540" y="118" width="170" height="112" rx="8" fill="#FBF3E4" stroke="#A9741A" stroke-width="2"/><text x="625" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#A9741A" text-anchor="middle">Corbeille</text><text x="625" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">restaurable 30 jours</text><text x="625" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">(purge_at)</text><rect x="790" y="118" width="170" height="112" rx="8" fill="#F8E9E6" stroke="#A63A2E" stroke-width="2"/><text x="875" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#A63A2E" text-anchor="middle">Purgé</text><text x="875" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">lignes en base (cascade)</text><text x="875" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">+ fichiers Storage</text><line x1="212" y1="160" x2="286" y2="160" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="216" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">archiver</text><line x1="286" y1="195" x2="212" y2="195" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="228" y="211" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">rouvrir</text><line x1="462" y1="160" x2="536" y2="160" stroke="#A9741A" stroke-width="2" marker-end="url(#aSig)"/><text x="466" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">supprimer</text><line x1="712" y1="160" x2="786" y2="160" stroke="#A63A2E" stroke-width="2" marker-end="url(#aDan)"/><text x="718" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#59615A" text-anchor="start">cron 03:00</text><path d="M 625 230 L 625 262 L 125 262 L 125 234" fill="none" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><text x="300" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#146B45" text-anchor="start">restaurer (jusqu'à l'échéance de purge_at)</text><text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">La purge réutilise le mécanisme du droit à l'effacement, paramétré par dossier_id : fichiers d'abord, puis lignes (documents,</text><text x="40" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">chunks, extraction, notes, chat, contradictions, checklist, exports) par cascade. usage_logs est conservé sous forme agrégée.</text><text x="40" y="392" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#59615A" text-anchor="start" letter-spacing="1.5">DOCUMENT</text><rect x="40" y="410" width="190" height="92" rx="8" fill="#F6F7F5" stroke="#59615A" stroke-width="2"/><text x="135" y="438" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#59615A" text-anchor="middle">en_attente</text><text x="135" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">fichier stocké,</text><text x="135" y="482" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">pas encore lu</text><rect x="270" y="410" width="190" height="92" rx="8" fill="#FBF3E4" stroke="#A9741A" stroke-width="2"/><text x="365" y="438" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#A9741A" text-anchor="middle">en_cours</text><text x="365" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">téléchargement,</text><text x="365" y="482" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">extraction, vecteurs</text><rect x="520" y="410" width="190" height="92" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="615" y="438" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#146B45" text-anchor="middle">indexé</text><text x="615" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">chunks écrits,</text><text x="615" y="482" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="middle">prêt pour l'analyse</text><line x1="232" y1="456" x2="266" y2="456" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><line x1="462" y1="456" x2="516" y2="456" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="520" y="520" width="190" height="56" rx="8" fill="#F8E9E6" stroke="#A63A2E" stroke-width="2"/><text x="615" y="546" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#A63A2E" text-anchor="middle">erreur</text><text x="615" y="564" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F130E" text-anchor="middle">error_message renseigné</text><path d="M 365 502 L 365 548 L 516 548" fill="none" stroke="#A63A2E" stroke-width="2" marker-end="url(#aDan)"/><rect x="750" y="410" width="220" height="92" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="1.6" stroke-dasharray="6 4"/><text x="860" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="middle">doublon détecté</text><text x="860" y="458" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">empreinte SHA-256 du texte</text><text x="860" y="476" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">déjà présente : is_duplicate_of,</text><text x="860" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="middle">aucune re-vectorisation</text><line x1="714" y1="456" x2="746" y2="456" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)" stroke-dasharray="5 4"/></svg>