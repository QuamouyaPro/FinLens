" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">vélocité, purge, alertes</text><rect x="270" y="428" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="440" y="428" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="610" y="428" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="780" y="428" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="695" y="438" width="162" height="28" rx="6" fill="#2E6B99"/><text x="30" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0F130E" text-anchor="start">Lot 6 — Conformité et sécurité</text><text x="30" y="528" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">en continu, bloquant avant lancement</text><rect x="270" y="486" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="440" y="486" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="610" y="486" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="780" y="486" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="270" y="496" width="672" height="28" rx="6" fill="#A9741A"/><text x="30" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0F130E" text-anchor="start">Lot 7 — Bêta fermée et lancement</text><text x="30" y="586" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">comptes payants, Stripe en réel</text><rect x="270" y="544" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="440" y="544" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="610" y="544" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="780" y="544" width="164" height="48" fill="#F6F7F5" rx="4"/><rect x="780" y="554" width="162" height="28" rx="6" fill="#59615A"/><text x="30" y="622" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#8A928A" text