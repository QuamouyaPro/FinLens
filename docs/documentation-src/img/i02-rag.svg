" text-anchor="middle">En place</text><line x1="490" y1="532" x2="510" y2="532" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="512" y="470" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#2E6B99" stroke-width="1.8" stroke-dasharray="6 4"/><text x="524" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Vérification</text><text x="524" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">l'extrait cité existe-t-il</text><text x="524" y="531" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">dans la page citée ?</text><rect x="524" y="564" width="96" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="572" y="578.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6B99" text-anchor="middle">À construire</text><line x1="728" y1="532" x2="748" y2="532" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="750" y="470" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="1.8"/><text x="762" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Réponse</text><text x="762" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">pastilles cliquables,</text><text x="762" y="531" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">panneau source</text><rect x="762" y="564" width="96" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="810" y="578.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">En place</text><rect x="36" y="620" width="928" height="100" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="52" y="646" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Pourquoi la vérification des citations compte</text><text x="52" y="668" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Le modèle renvoie lui-même l'extrait qu'il prétend citer. Un contrôle programmatique simple — l'extrait figure-t-il, mot pour mot,</text><text x="52" y="685" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">dans un des passages fournis ? — permet de marquer une citation non vérifiable avant de l'afficher. C'est le seul moyen de rendre la promesse</text><text x="52" y="702" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">« chaque réponse cite sa source » mesurable plutôt que seulement affichée.</text></svg>