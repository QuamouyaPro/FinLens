 height="22" rx="11" fill="#FBF3E4" stroke="#FBF3E4" stroke-width="1.2"/><text x="848" y="224.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A9741A" text-anchor="middle">Partiel</text><text x="40" y="288" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#59615A" text-anchor="start" letter-spacing="1.2">QUESTION — à chaque message du Copilote</text><rect x="36" y="304" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="1.8"/><text x="48" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Question</text><text x="48" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">texte libre,</text><text x="48" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">4 000 caractères max</text><rect x="48" y="398" width="96" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="96" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">En place</text><line x1="252" y1="366" x2="272" y2="366" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="274" y="304" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="1.8"/><text x="286" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Embedding de la requête</text><text x="286" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">même modèle que</text><text x="286" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">les documents</text><rect x="286" y="398" width="96" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="334" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">En place</text><line x1="490" y1="366" x2="510" y2="366" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="512" y="304" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#2E6B99" stroke-width="1.8" stroke-dasharray="6 4"/><text x="524" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Recherche hybride</text><text x="524" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">vecteur + plein texte,</text><text x="524" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">fusion RRF</text><rect x="524" y="398" width="96" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="572" y="412.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6B99" text-anchor="middle">À construire</text><line x1="728" y1="366" x2="748" y2="366" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="750" y="304" width="214" height="124" rx="8" fill="#FFFFFF" stroke="#2E6B99" stroke-width="1.8" stroke-dasharray="6 4"/><text x="762" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Reclassement</text><text x="762" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">rerank des ~30 passages</text><text x="762" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#59615A" text-anchor="start">retenus</text><rect x="762" y="398" width="96" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="810" y="41