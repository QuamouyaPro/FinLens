<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/></marker><marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/></marker><marker id="aDan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A2E"/></marker><marker id="aSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9741A"/></marker><marker id="aInf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B99"/></marker></defs><rect width="1000" height="560" fill="#FFFFFF"/><text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Feuille de route agents</text><text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Chaque marche augmente l'autonomie — et les garde-fous qui l'accompagnent</text><rect x="36" y="330" width="222" height="150" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="1.8"/><circle cx="62" cy="358" r="14" fill="#146B45"/><text x="62" y="363.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text><text x="86" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F130E" text-anchor="start">Assistant</text><rect x="50" y="382" width="74" height="22" rx="11" fill="#FFFFFF" stroke="#146B45" stroke-width="1.2"/><text x="87" y="396.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">En place</text><text x="50" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Copilote et notes par profil.</text><text x="50" y="443" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Le modèle répond, l'humain décide.</text><text x="50" y="460" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Aucune action sur le monde.</text><rect x="272" y="260" width="222" height="220" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.8"/><circle cx="298" cy="288" r="14" fill="#146B45"/><text x="298" y="293.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="322" y="294" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F130E" text-anchor="start">Automatisations</text><rect x="286" y="312" width="102" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="337" y="326.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6B99" text-anchor="middle">À construire</text><text x="286" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Tâches en file : analyse,</text><text x="286" y="373" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">contrôles, alertes.</text><text x="286" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Déclenchées par un événement,</text><text x="286" y="407" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">jamais par le modèle.</text><rect x="508" y="190" width="222" height="290" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.8"/><circle cx="534" cy="218" r="14" fill="#146B45"/><text x="534" y="223.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="558" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F130E" text-anchor="start">Agents supervisés</text><rect x="522" y="242" width="102" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="573" y="256.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6B99" text-anchor="middle">À construire</text><text x="522" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Complétude documentaire, veille.</text><text x="522" y="303" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Outils en lecture seule, budget de</text><text x="522" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">tokens borné, validation humaine.</text><rect x="744" y="120" width="222" height="360" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.8"/><circle cx="770" cy="148" r="14" fill="#146B45"/><text x="770" y="153.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="794" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F130E" text-anchor="start">Agents rédacteurs</text><rect x="758" y="172" width="102" height="22" rx="11" fill="#E7F0F7" stroke="#E7F0F7" stroke-width="1.2"/><text x="809" y="186.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6B99" text-anchor="middle">À décider</text><text x="758" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Pré-rédaction de mémo, data rooms,</text><text x="758" y="233" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">messageries. Périmètre, droits et</text><text x="758" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">coûts bornés ; journal complet.</text><line x1="36" y1="520" x2="940" y2="520" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="36" y="545" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#59615A" text-anchor="start">autonomie croissante  →</text><text x="964" y="545" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#59615A" text-anchor="end">→  garde-fous et journalisation croissants</text></svg>