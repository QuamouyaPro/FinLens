<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/></marker><marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/></marker><marker id="aDan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A2E"/></marker><marker id="aSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9741A"/></marker><marker id="aInf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B99"/></marker></defs><rect width="1000" height="800" fill="#FFFFFF"/><text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Flux de données personnelles et localisation</text><text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Où passe le contenu des dossiers, et ce qui reste à vérifier avant d'ouvrir à de vrais clients</text><rect x="30" y="330" width="150" height="80" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="105" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F130E" text-anchor="middle">Analyste</text><text x="105" y="385" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="middle">navigateur</text><rect x="250" y="105" width="270" height="175" rx="8" fill="#FFFFFF" stroke="#A9741A" stroke-width="2"/><text x="268" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">Vercel</text><text x="268" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Interface et routes API :</text><text x="268" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">reçoit les fichiers, appelle</text><text x="268" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">l'IA, renvoie les résultats</text><rect x="268" y="232" width="220" height="22" rx="11" fill="#FBF3E4" stroke="#FBF3E4" stroke-width="1.2"/><text x="378" y="246.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A9741A" text-anchor="middle">Région des fonctions : à fixer</text><rect x="250" y="335" width="270" height="190" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="2"/><text x="268" y="364" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">Supabase — Francfort</text><text x="268" y="386" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Auth · Postgres + RLS · pgvector</text><text x="268" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Storage : documents, exports</text><text x="268" y="418" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Contenu des dossiers au repos</text><rect x="268" y="474" width="200.2" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="368.1" y="488.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">UE confirmée (eu-central-1)</text><rect x="250" y="575" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#146B45" stroke-width="2" stroke-dasharray="7 5"/><text x="268" y="604" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">VPS Hostinger — France</text><text x="268" y="626" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Cible : worker, ingestion, n8n</text><text x="268" y="642" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Aujourd'hui : aucun service</text><rect x="268" y="676" width="187" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="361.5" y="690.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">UE (France) — non utilisé</text><rect x="620" y="105" width="350" height="150" rx="8" fill="#FFFFFF" stroke="#A63A2E" stroke-width="2"/><text x="638" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">API Anthropic</text><text x="638" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Reçoit les passages et le corpus à analyser,</text><text x="638" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">les questions des utilisateurs.</text><text x="638" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">DPA et clauses types : conditions commerciales</text><rect x="638" y="214" width="220" height="22" rx="11" fill="#F8E9E6" stroke="#F8E9E6" stroke-width="1.2"/><text x="748" y="228.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A63A2E" text-anchor="middle">Transfert hors UE — à encadrer</text><rect x="620" y="285" width="350" height="150" rx="8" fill="#FFFFFF" stroke="#A9741A" stroke-width="2"/><text x="638" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">Voyage AI (embeddings)</text><text x="638" y="336" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Reçoit le texte de tous les chunks des</text><text x="638" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">documents pour le vectoriser.</text><text x="638" y="368" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Absent des notes d'architecture initiales</text><rect x="638" y="394" width="292.59999999999997" height="22" rx="11" fill="#FBF3E4" stroke="#FBF3E4" stroke-width="1.2"/><text x="784.3" y="408.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A9741A" text-anchor="middle">Localisation, DPA, rétention : à vérifier</text><rect x="620" y="465" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#A9741A" stroke-width="2"/><text x="638" y="494" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F130E" text-anchor="start">Stripe (paiement)</text><text x="638" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Nom, e-mail, facturation —</text><text x="638" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">jamais le contenu des dossiers</text><rect x="638" y="542" width="114.39999999999999" height="22" rx="11" fill="#FBF3E4" stroke="#FBF3E4" stroke-width="1.2"/><text x="695.2" y="556.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A9741A" text-anchor="middle">DPA à vérifier</text><line x1="180" y1="355" x2="246" y2="215" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><line x1="180" y1="375" x2="246" y2="420" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="40" y="318" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#8A928A" text-anchor="start">fichiers, questions</text><line x1="385" y1="280" x2="385" y2="331" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)" marker-start="url(#aAcc)"/><line x1="520" y1="160" x2="616" y2="160" stroke="#A63A2E" stroke-width="2" marker-end="url(#aDan)"/><line x1="520" y1="230" x2="616" y2="330" stroke="#A9741A" stroke-width="2" marker-end="url(#aSig)"/><line x1="520" y1="255" x2="616" y2="505" stroke="#A9741A" stroke-width="2" marker-end="url(#aSig)"/><line x1="385" y1="525" x2="385" y2="571" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)" marker-start="url(#aAcc)" stroke-dasharray="6 4"/><path d="M 520 650 L 580 650 L 580 195 L 616 195" fill="none" stroke="#A63A2E" stroke-width="1.6" marker-end="url(#aDan)"/><text x="524" y="640" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#8A928A" text-anchor="start">cible</text><text x="40" y="760" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F130E" text-anchor="start">Légende :</text><rect x="110" y="745" width="101.19999999999999" height="22" rx="11" fill="#E8F3ED" stroke="#E8F3ED" stroke-width="1.2"/><text x="160.6" y="759.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#146B45" text-anchor="middle">UE confirmée</text><rect x="230" y="745" width="88" height="22" rx="11" fill="#FBF3E4" stroke="#FBF3E4" stroke-width="1.2"/><text x="274" y="759.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A9741A" text-anchor="middle">À vérifier</text><rect x="325" y="745" width="68.19999999999999" height="22" rx="11" fill="#F8E9E6" stroke="#F8E9E6" stroke-width="1.2"/><text x="359.1" y="759.96" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#A63A2E" text-anchor="middle">Hors UE</text><text x="40" y="782" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#0F130E" text-anchor="start">Les clés Anthropic et Voyage ne sont volontairement pas encore configurées : la revue de ces deux sous-traitants est un préalable.</text></svg>