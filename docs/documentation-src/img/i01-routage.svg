<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59615A"/></marker><marker id="aAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146B45"/></marker><marker id="aDan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A63A2E"/></marker><marker id="aSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9741A"/></marker><marker id="aInf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B99"/></marker></defs><rect width="1000" height="740" fill="#FFFFFF"/><text x="40" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F130E" text-anchor="start">Routage des modèles par tâche</text><text x="40" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#59615A" text-anchor="start">Le modèle qui lit et juge reste Fable 5 ; le reste est confié à plus économique</text><rect x="610" y="100" width="360" height="170" rx="8" fill="#E8F3ED" stroke="#146B45" stroke-width="2"/><text x="628" y="132" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#146B45" text-anchor="start">Claude Fable 5</text><text x="628" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">10 $ / 50 $ par million de tokens</text><text x="628" y="177" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Lit et juge les documents</text><text x="628" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Toujours sur l'analyse</text><rect x="610" y="300" width="360" height="130" rx="8" fill="#E7F0F7" stroke="#2E6B99" stroke-width="2"/><text x="628" y="332" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2E6B99" text-anchor="start">Claude Sonnet 5</text><text x="628" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">2 $ / 10 $ par million de tokens</text><text x="628" y="377" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Reformule, converse</text><text x="628" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Environ 5× moins cher que Fable 5</text><rect x="610" y="460" width="360" height="120" rx="8" fill="#FBF3E4" stroke="#A9741A" stroke-width="2"/><text x="628" y="492" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#A9741A" text-anchor="start">Claude Haiku 4.5</text><text x="628" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">1 $ / 5 $ par million de tokens</text><text x="628" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F130E" text-anchor="start">Tâches internes invisibles</text><rect x="30" y="100" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Extraction exhaustive du dossier</text><line x1="362" y1="122" x2="606" y2="173" stroke="#146B45" stroke-width="1.6" marker-end="url(#aAcc)"/><rect x="30" y="156" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Comparateur de dossiers</text><line x1="362" y1="178" x2="606" y2="181" stroke="#146B45" stroke-width="1.6" marker-end="url(#aAcc)"/><rect x="30" y="212" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Détection de contradictions</text><line x1="362" y1="234" x2="606" y2="189" stroke="#146B45" stroke-width="1.6" marker-end="url(#aAcc)"/><rect x="30" y="268" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Copilote — question complexe</text><line x1="362" y1="290" x2="606" y2="197" stroke="#146B45" stroke-width="1.6" marker-end="url(#aAcc)"/><rect x="30" y="324" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="351" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Reformulation par profil (×6)</text><line x1="362" y1="346" x2="606" y2="353" stroke="#2E6B99" stroke-width="1.6" marker-end="url(#aInf)"/><rect x="30" y="380" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="407" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Copilote — question standard</text><line x1="362" y1="402" x2="606" y2="361" stroke="#2E6B99" stroke-width="1.6" marker-end="url(#aInf)"/><rect x="30" y="436" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="463" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Classification de complexité</text><line x1="362" y1="458" x2="606" y2="524" stroke="#A9741A" stroke-width="1.6" marker-end="url(#aSig)"/><rect x="30" y="492" width="330" height="44" rx="8" fill="#FFFFFF" stroke="#D7DCD5" stroke-width="1.5"/><text x="46" y="519" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F130E" text-anchor="start">Classement d'un ajout épinglé</text><line x1="362" y1="514" x2="606" y2="532" stroke="#A9741A" stroke-width="1.6" marker-end="url(#aSig)"/><rect x="30" y="590" width="940" height="120" rx="8" fill="#F6F7F5" stroke="#D7DCD5" stroke-width="1.5"/><text x="48" y="616" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#0F130E" text-anchor="start">Chemin d'une question du Copilote</text><rect x="48" y="634" width="98" height="30" rx="15" fill="#FFFFFF" stroke="#0F130E" stroke-width="1.2"/><text x="97" y="653.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0F130E" text-anchor="middle">Question</text><line x1="148" y1="649" x2="166" y2="649" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="634" width="162" height="30" rx="15" fill="#FBF3E4" stroke="#A9741A" stroke-width="1.2"/><text x="251" y="653.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#A9741A" text-anchor="middle">Haiku 4.5 classe</text><line x1="334" y1="649" x2="352" y2="649" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><rect x="356" y="634" width="98" height="30" rx="15" fill="#E7F0F7" stroke="#2E6B99" stroke-width="1.2"/><text x="405" y="653.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2E6B99" text-anchor="middle">standard</text><line x1="456" y1="649" x2="474" y2="649" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><rect x="478" y="634" width="98" height="30" rx="15" fill="#E7F0F7" stroke="#2E6B99" stroke-width="1.2"/><text x="527" y="653.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2E6B99" text-anchor="middle">Sonnet 5</text><rect x="226" y="676" width="90" height="26" rx="13" fill="#E8F3ED" stroke="#146B45" stroke-width="1.2"/><text x="271" y="693.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#146B45" text-anchor="middle">complexe</text><line x1="318" y1="689" x2="344" y2="689" stroke="#146B45" stroke-width="2" marker-end="url(#aAcc)"/><rect x="348" y="676" width="90" height="26" rx="13" fill="#E8F3ED" stroke="#146B45" stroke-width="1.2"/><text x="393" y="693.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#146B45" text-anchor="middle">Fable 5</text><text x="660" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Le cache de prompt (1 h) rend la relecture du</text><text x="660" y="670" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">contexte d'une session à 10 % du tarif d'entrée.</text><text x="660" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#59615A" text-anchor="start">Le cache est propre à chaque modèle.</text></svg>