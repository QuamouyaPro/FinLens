><text x="46" y="806" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#8A928A" text-anchor="start">Non représenté : file de jobs (table à créer — voir document 04) · auth.users (géré par Supabase Auth).</text><line x1="430" y1="338" x2="430" y2="364" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><line x1="750" y1="338" x2="750" y2="364" stroke="#59615A" stroke-width="2" marker-end="url(#a)"/><text x="440" y="356" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" fill="#8A928A" text-anchor="start">dossier_id</text><text x="760" y="356" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" fill="#8A928A" text-anchor="start">dossier_id</text><text x="40" y="862" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F130E" text-anchor="start">organization_id est présent sur toutes les tables métier : c'est la clé d'isolation appliquée par les politiques RLS.</text></svg>